<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Household Dashboard V57</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-body: #f4f7f6; --bg-card: #ffffff; --text-main: #333333; --text-muted: #555555; 
            --heading: #2c3e50; --border: #cccccc; --th-bg: #f8f9fa; --input-bg: #ffffff;
            --cal-empty: transparent; --cal-day: #fdfdfd; --cal-border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg-body: #1a1a2e; --bg-card: #16213e; --text-main: #e9e9eb; --text-muted: #b0b3b8; 
            --heading: #ffffff; --border: #444444; --th-bg: #0f3460; --input-bg: #1a1a2e;
            --cal-empty: transparent; --cal-day: #16213e; --cal-border: #333333;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-body); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; transition: 0.3s; padding-bottom: 50px;}
        h1, h2, h3 { color: var(--heading); margin-top: 0; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .top-bar-btns { display: flex; gap: 10px; flex-wrap: wrap;}
        
        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
        .card { background: var(--bg-card); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; transition: 0.3s; }
        
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 130px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: var(--text-muted);}
        input, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 14px; background: var(--input-bg); color: var(--text-main); color-scheme: light dark;}
        
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; transition: 0.2s;}
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; margin-top: 10px; font-size: 16px; padding: 12px;}
        .btn-success:hover { background-color: #27ae60; }
        .btn-outline { background-color: transparent; color: #3498db; border: 2px solid #3498db; margin-bottom: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
        th { background-color: var(--th-bg); color: var(--heading); }
        .income-text { color: #2ecc71; font-weight: bold; }
        .danger { background-color: rgba(231, 76, 60, 0.1) !important; color: #c0392b !important; }
        .shifted { background-color: rgba(243, 156, 18, 0.1) !important; }
        .is-paid td { opacity: 0.5; text-decoration: line-through; }
        
        .badge { display: inline-block; padding: 3px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; margin-right: 5px; text-transform: uppercase;}
        .badge-flex { background-color: #f39c12; color: white; }
        .badge-sinking { background-color: #1abc9c; color: white; }
        .badge-project { background-color: #7f8c8d; color: white; }
        
        .streak-counter { display: flex; align-items: center; gap: 10px; background: rgba(243, 156, 18, 0.1); padding: 10px 15px; border-radius: 8px; border: 1px solid #f39c12; font-weight: bold; color: #d35400; margin-bottom: 20px;}
        .streak-fire { font-size: 24px; animation: flicker 1.5s infinite alternate; }
        @keyframes flicker { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.8; transform: scale(1.1); } }
        
        .insights-box { background: rgba(52, 152, 219, 0.1); padding: 15px; border-radius: 8px; border-left: 4px solid #3498db; margin-bottom: 20px; font-size: 14px;}
        .insights-box h3 { margin: 0 0 8px 0; color: #2980b9; display: flex; align-items: center; gap: 5px; }

        .chart-container { position: relative; height: 200px; width: 100%; display: flex; justify-content: center; margin-top: 10px;}
        .goal-container, .debt-container, .rule-group { margin-bottom: 15px; background: rgba(0,0,0,0.02); padding: 10px; border-radius: 6px; border: 1px solid var(--border);}
        .goal-header, .rule-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .goal-track { background: var(--border); height: 10px; border-radius: 5px; overflow: hidden; }
        .goal-fill { background: #1abc9c; height: 100%; transition: width 0.5s ease; }
        
        .sub-auditor { background: rgba(155, 89, 182, 0.1); padding: 15px; border-radius: 6px; border-left: 4px solid #9b59b6; margin-bottom: 20px; }
        .sub-auditor h3 { margin: 0 0 5px 0; font-size: 14px; color: #8e44ad; }
        .sub-auditor .burn-rate { font-size: 24px; font-weight: bold; color: var(--heading); }
        .cloud-indicator { font-size: 12px; color: #27ae60; font-weight: bold; display: flex; align-items: center; gap: 5px; margin-bottom: 10px;}
        .pulse-dot { width: 8px; height: 8px; background-color: #27ae60; border-radius: 50%; animation: pulse-dot 1.5s infinite; }
        @keyframes pulse-dot { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(39, 174, 96, 0); } 100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); } }

        .sandbox-banner { display: none; background: #e67e22; color: white; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        #actionAlerts { display:none; margin-bottom: 20px; padding: 15px; border-radius: 8px; border-left: 4px solid #e74c3c; background: rgba(231, 76, 60, 0.1); }

        /* Calendar Styles */
        .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-nav { background: var(--th-bg); color: var(--text-main); border: 1px solid var(--border); width: auto; padding: 5px 15px; }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; font-weight: bold; text-align: center; color: var(--text-muted); font-size: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 5px; }
        .calendar-day { background: var(--cal-day); border: 1px solid var(--cal-border); border-radius: 4px; padding: 4px; min-height: 80px; display: flex; flex-direction: column; }
        .calendar-day.empty { background: var(--cal-empty); border: none; }
        .day-number { font-weight: bold; color: var(--heading); margin-bottom: 5px; font-size: 12px; }
        .cal-event { font-size: 10px; margin-bottom: 2px; padding: 2px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .cal-income { background-color: rgba(46, 204, 113, 0.2); color: #145a32; border-left: 3px solid #27ae60; }
        .cal-expense { background-color: rgba(231, 76, 60, 0.2); color: #78281f; border-left: 3px solid #e74c3c; }
        .cal-shifted { background-color: rgba(243, 156, 18, 0.2); color: #7e5109; border-left: 3px solid #f39c12; border-style: dashed; }
        .cal-is-paid { opacity: 0.4; text-decoration: line-through; border-left: 3px solid #7f8c8d; background-color: rgba(127, 140, 141, 0.1); color: var(--text-main); }
        .cal-eod-balance { margin-top: auto; font-size: 10px; font-weight: bold; text-align: right; color: var(--text-muted); }
        .cal-eod-negative { color: #e74c3c !important; }
        
        [data-theme="dark"] .cal-income { color: #2ecc71; }
        [data-theme="dark"] .cal-expense { color: #e74c3c; }
        [data-theme="dark"] .cal-shifted { color: #f39c12; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <h1>Household Dashboard <span style="font-size: 14px; color: #e74c3c; font-weight:bold;" id="versionLabel">V57</span></h1>
            <div class="cloud-indicator" id="cloudStatus"><div class="pulse-dot"></div> Connecting to Database...</div>
        </div>
        <div class="top-bar-btns">
            <button class="btn-outline" style="width: auto; padding: 8px 12px;" onclick="openMasterModal()">📋 Master List</button>
            <button class="btn-outline" style="width: auto; padding: 8px 12px;" onclick="exportCSV()">📥 Export CSV</button>
            <button class="btn-outline" style="width: auto; padding: 8px 12px; border-color:#e67e22; color:#e67e22;" id="sandboxBtn" onclick="toggleSandbox()">🧪 Sandbox Mode</button>
            <button class="btn-outline" style="width: auto; padding: 8px 12px;" onclick="toggleTheme()">🌙 Theme</button>
        </div>
    </div>

    <div id="sandboxBanner" class="sandbox-banner">
        🧪 SANDBOX MODE ACTIVE: Feel free to play! Changes here will NOT be saved to your real budget.
    </div>

    <div id="actionAlerts"></div>

    <!-- Modals -->
    <div id="masterModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:var(--bg-card); padding:25px; border-radius:8px; width:500px; max-width:90%; color:var(--text-main); max-height: 80vh; display: flex; flex-direction: column;">
            <h2 style="margin-bottom: 5px;">📋 Master Bill List</h2>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom: 15px;">Sorted chronologically by next due date.</p>
            <div id="masterListContainer" style="overflow-y: auto; flex:1; margin-bottom:15px; border: 1px solid var(--border); padding: 10px; border-radius: 6px;"></div>
            <button class="btn-outline" onclick="document.getElementById('masterModal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="accountModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:var(--bg-card); padding:25px; border-radius:8px; width:400px; color:var(--text-main);">
            <h2>Manage Accounts</h2>
            <div id="accountListContainer" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto;"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="newAccName" placeholder="Name" style="flex:1;">
                <input type="color" id="newAccColor" value="#3498db" style="width: 40px; padding:2px; height:36px;">
                <button onclick="addCustomAccount()" style="width: auto;">Add</button>
            </div>
            <button class="btn-outline" onclick="document.getElementById('accountModal').style.display='none'" style="margin-top: 20px;">Done</button>
        </div>
    </div>

    <div id="categoryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:var(--bg-card); padding:25px; border-radius:8px; width:400px; color:var(--text-main);">
            <h2>Manage Categories & Budgets</h2>
            <div id="categoryListContainer" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto;"></div>
            <div style="display: flex; gap: 10px; align-items:flex-end;">
                <div style="flex:2;">
                    <label>Name</label>
                    <input type="text" id="newCatName" placeholder="e.g. Travel">
                </div>
                <div style="flex:1;">
                    <label>Bucket</label>
                    <select id="newCatBucket">
                        <option value="needs">Needs (50%)</option>
                        <option value="wants">Wants (30%)</option>
                        <option value="savings">Savings (20%)</option>
                    </select>
                </div>
                <div style="flex:1;">
